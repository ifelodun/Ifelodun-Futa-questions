{% extends 'base.html' %}
{% block content %}
<h2>Reset Password</h2>
<form method="POST">
    <label>OTP:</label>
    <input type="text" name="otp" required>
    <label>New Password:</label>
    <input type="password" name="password" required>
    <button type="submit">Reset Password</button>
</form>
{% endblock %}
