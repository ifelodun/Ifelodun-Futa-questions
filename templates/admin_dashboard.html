{% extends 'base.html' %}
{% block content %}
<h2>Admin Dashboard</h2>
<table border="1" cellpadding="10" cellspacing="0">
    <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Grades</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for student in students %}
        <tr>
            <td>{{ student.name }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.grades }}</td>
            <td>
                <a href="{{ url_for('admin_reset_student', student_id=student.id) }}">Reset Password</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
